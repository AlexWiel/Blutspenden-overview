name: Website auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - data/**
      - blutspenden/**
      - tests/**
      - scripts/persist_refresh.sh
      - .github/workflows/pages.yml
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Termine vor der Veröffentlichung beim Roten Kreuz aktualisieren
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.refresh_data))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.persist.outputs.sha }}
      import_outcome: ${{ steps.fetch.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Termine aktualisieren
        id: fetch
        continue-on-error: true
        run: python3 -m blutspenden --output-dir data
      - name: Terminbestand und Abrufstatus dauerhaft speichern
        id: persist
        shell: bash
        run: |
          commit="$(bash scripts/persist_refresh.sh)"
          echo "sha=$commit" >> "$GITHUB_OUTPUT"

  build:
    needs: refresh
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.refresh.outputs.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Import- und Archivtests
        run: python3 -m unittest discover -s tests -p 'test_[bcsu]*.py' -v
      - name: Website-Logik prüfen
        run: node --test tests/test_web_model.mjs
      - name: Website paketieren
        run: python3 -m blutspenden.build_site --output-dir "${{ runner.temp }}/pages-site"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  refresh_failure:
    needs: [refresh, deploy]
    if: ${{ always() && needs.refresh.outputs.import_outcome == 'failure' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fehlgeschlagenen Quellabruf melden
        run: |
          echo '::error::Der Quellabruf ist fehlgeschlagen. Der letzte gültige Terminbestand bleibt erhalten; der neue Fehlerstatus wurde zur Veröffentlichung vorbereitet.'
          exit 1
