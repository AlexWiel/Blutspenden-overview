name: Website auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - data/**
      - blutspenden/**
      - tests/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Import- und Archivtests
        run: python3 -m unittest discover -s tests -p 'test_[bcsu]*.py' -v
      - name: Website-Logik prüfen
        run: node --test tests/test_web_model.mjs
      - name: Website paketieren
        run: python3 -m blutspenden.build_site --output-dir "${{ runner.temp }}/pages-site"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
